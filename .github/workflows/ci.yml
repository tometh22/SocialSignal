name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mind_test
          POSTGRES_PASSWORD: mind_test
          POSTGRES_DB: mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FINANCIAL_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      TEST_MCP_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run check

      - name: Build production bundle
        run: npm run build
