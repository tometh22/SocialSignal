name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mind_test
          POSTGRES_PASSWORD: mind_test
          POSTGRES_DB: mind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FINANCIAL_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      TEST_MCP_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      NOTIFICATION_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      ABSENCE_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      TRAINING_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test
      TASK_LIST_TEST_DATABASE_URL: postgres://mind_test:mind_test@localhost:5432/mind_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/attached_assets/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Check initial JavaScript budget
        run: npm run check:bundle

      - name: Prepare isolated browser database
        env:
          PGPASSWORD: mind_test
          DATABASE_URL: postgres://mind_test:mind_test@127.0.0.1:5432/mind_e2e
        run: |
          createdb -h 127.0.0.1 -U mind_test mind_e2e
          npx drizzle-kit push --force
          npx tsx scripts/seed-performance-e2e.ts
          npm run db:performance-indexes

      - name: Install browser
        run: |
          # Keep dependency verification while avoiding the slow regional mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: .context/e2e-results
          retention-days: 7
